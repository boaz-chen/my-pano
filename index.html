<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e3a5f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>פנו דרך — לוח אימונים</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --primary: #1e3a5f;
      --primary-light: #2a4f7f;
      --accent: #16a34a;
      --accent-bg: #f0fdf4;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: #1e293b;
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      text-align: center;
      padding: 1.8rem 1rem 1.4rem;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 12px rgba(0,0,0,.15);
    }
    header h1 {
      font-size: 1.5rem;
      margin-bottom: .25rem;
      letter-spacing: -.02em;
    }
    header p {
      color: rgba(255,255,255,.75);
      font-size: .85rem;
    }

    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 1rem .75rem 6rem;
    }

    /* status bar */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      padding: .8rem;
      font-size: .82rem;
      color: var(--muted);
    }
    .status-bar.error { color: #dc2626; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2.5px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .dot { color: var(--accent); font-size: 1.2rem; line-height: 1; }

    /* schedule title */
    #schedule-title {
      text-align: center;
      font-size: 1.05rem;
      font-weight: 600;
      margin-top: .4rem;
      color: rgba(255,255,255,.85);
    }

    /* day cards */
    .day-card {
      background: var(--card);
      border-radius: var(--radius);
      margin-bottom: .75rem;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .day-header {
      background: var(--primary);
      color: white;
      padding: .65rem 1rem;
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: .55rem;
    }
    .day-badge {
      background: rgba(255,255,255,.18);
      color: white;
      font-size: .8rem;
      font-weight: 700;
      min-width: 1.55rem;
      height: 1.55rem;
      padding: 0 .4rem;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .sessions { padding: .25rem 0; }

    .session {
      display: flex;
      align-items: flex-start;
      gap: .75rem;
      padding: .75rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .session:last-child { border-bottom: none; }

    .session-time {
      background: var(--accent-bg);
      color: var(--accent);
      font-weight: 800;
      font-size: .9rem;
      padding: .25rem .5rem;
      border-radius: 8px;
      white-space: nowrap;
      flex-shrink: 0;
      min-width: 52px;
      text-align: center;
    }
    .session-details { flex: 1; min-width: 0; }
    .session-group {
      font-weight: 600;
      font-size: .92rem;
      line-height: 1.4;
    }
    .session-location {
      font-size: 1rem;
      color: #475569;
      margin-top: .3rem;
      line-height: 1.4;
    }

    /* footer */
    footer {
      text-align: center;
      padding: .5rem 1rem;
      color: var(--muted);
      font-size: .75rem;
    }
    footer a { color: var(--primary); text-decoration: none; }

    /* pull-to-refresh hint */
    @media (max-width: 640px) {
      main { padding: .75rem .5rem 6rem; }
      .day-card { border-radius: 14px; }
      .session { padding: .7rem .85rem; }
    }
  </style>
</head>
<body>

<header>
  <img src="pano-logo.webp" alt="פנו דרך" style="height:80px;object-fit:contain;display:block;margin:0 auto;" />
  <h2 id="schedule-title"></h2>
</header>

<main>
  <div id="status" class="status-bar"><span class="spinner"></span> טוען לוח אימונים…</div>
  <div id="schedule"></div>
</main>

<footer>
  <div id="update-info"></div>
  נתונים מ-<a href="https://panuderech.vercel.app/#schedule">panuderech.vercel.app</a>
</footer>

<script>
const SCHEDULE_URL = "schedule.json";

// Hebrew weekday → index (ראשון = Sunday = 0 … שבת = Saturday = 6).
const HE_DAY_INDEX = {
  "ראשון": 0, "שני": 1, "שלישי": 2, "רביעי": 3,
  "חמישי": 4, "שישי": 5, "שבת": 6,
};

// Parse a schedule title → {startDay, month} (and optionally endDay).
// Handles two formats:
//   cross-month "26.4-2.5"  (startDay.startMonth-endDay.endMonth)
//   same-month  "8-14.3"    (startDay-endDay.month)
// Returns null if no recognizable date range is found.
function parseWeekRange(title) {
  if (!title) return null;
  let m = title.match(/(\d{1,2})\.(\d{1,2})\s*[-–]\s*\d{1,2}\.\d{1,2}/);
  if (m) return { startDay: +m[1], month: +m[2] };
  m = title.match(/(\d{1,2})\s*[-–]\s*(\d{1,2})\.(\d{1,2})/);
  if (!m) return null;
  return { startDay: +m[1], endDay: +m[2], month: +m[3] };
}

// Compute the calendar date for a given Hebrew day name within a parsed week.
// Relies on JS Date auto-normalizing day overflow (e.g. April 31 → May 1),
// and shifts year if the result drifts more than ~6 months from today.
function dateForDay(dayName, range, today = new Date()) {
  if (!range) return null;
  const idx = HE_DAY_INDEX[dayName];
  if (idx === undefined) return null;

  const year = today.getFullYear();
  const day = range.startDay + idx;

  let d = new Date(year, range.month - 1, day);
  const diffMonths = (d - today) / (1000 * 60 * 60 * 24 * 30);
  if (diffMonths > 6) d = new Date(year - 1, range.month - 1, day);
  else if (diffMonths < -6) d = new Date(year + 1, range.month - 1, day);
  return d;
}

function render(data) {
  document.getElementById("schedule-title").textContent = data.title;
  const container = document.getElementById("schedule");
  container.innerHTML = "";

  const range = parseWeekRange(data.title);

  for (const day of data.days) {
    const card = document.createElement("div");
    card.className = "day-card";
    const date = dateForDay(day.day, range);
    const badge = date
      ? `<span class="day-badge">${date.getDate()}</span>`
      : "";
    let html = `<div class="day-header">${badge}${esc(day.day)}</div><div class="sessions">`;
    for (const s of day.sessions) {
      html += `<div class="session">
        <span class="session-time">${esc(s.time)}</span>
        <div class="session-details">
          <div class="session-group">${esc(s.group)}</div>
          ${s.location ? `<div class="session-location">📍 ${esc(s.location)}</div>` : ""}
        </div>
      </div>`;
    }
    html += "</div>";
    card.innerHTML = html;
    container.appendChild(card);
  }
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function timeOnly(date) {
  return date.toLocaleString("he-IL", { hour: "2-digit", minute: "2-digit" });
}

function updateTimestamps(scrapedAt) {
  const scraped = new Date(scrapedAt);
  document.getElementById("update-info").textContent = `עודכן לאחרונה: ${timeOnly(scraped)}`;
}

async function load() {
  const status = document.getElementById("status");
  status.className = "status-bar";
  status.innerHTML = '<span class="spinner"></span> טוען לוח אימונים…';
  status.style.display = "flex";

  try {
    const res = await fetch(SCHEDULE_URL + "?t=" + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (!data.days || data.days.length === 0) throw new Error("לא נמצאו אימונים");

    render(data);
    updateTimestamps(data.scraped_at);
    status.style.display = "none";
  } catch (e) {
    status.className = "status-bar error";
    status.textContent = `שגיאה: ${e.message}`;
  }
}

load();
</script>
</body>
</html>
